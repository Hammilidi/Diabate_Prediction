
<!-- base.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="icon" type="image/x-icon" href="../static/favicon.ico"> -->
    <link rel="icon" type="image/png" href="../static/favicon.ico?v=2">
    <title>{% block title %}DiabetoWeb{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/base.css">

</head>
<body>
    {% if username %}
    <nav class="navbar">
        <div class="nav-container">
            <a href="/home" class="logo">
                <i class="fas fa-heartbeat"></i>DiabetoWeb
            </a>
            <ul class="nav-links">
                <li><a href="/home"><i class="fas fa-home"></i> Accueil</a></li>
                <li><a href="/patients"><i class="fas fa-users"></i> Patients</a></li>
                <li><a href="/add"><i class="fas fa-user-plus"></i> Ajouter</a></li>
            </ul>
            <div class="user-info">
                <div class="user-avatar">
                    {{ username[0].upper() }}
                </div>
                <span>Dr. {{ username }}</span>
                <a href="/logout" class="btn btn-danger btn-sm">
                    <i class="fas fa-sign-out-alt"></i> Déconnexion
                </a>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script>
        // Animation d'entrée pour les cartes
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.6s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });

        // Confirmation de suppression
        function confirmDelete(name) {
            return confirm(`Êtes-vous sûr de vouloir supprimer le patient ${name} ?`);
        }
    </script>
</body>
</html>
